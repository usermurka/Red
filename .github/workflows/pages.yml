name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Разрешаем только одному запуску одновременно: новый push отменяет
# предыдущий running-запуск вместо того, чтобы падать с ошибкой
# "in-progress deployment" (HTTP 400) в actions/deploy-pages.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
